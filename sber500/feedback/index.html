<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Доступ по ссылке</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@500&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   ТИПОГРАФИЧЕСКАЯ ШКАЛА – РОВНО 4 РОЛИ, КУРСИВОВ НЕТ
   Р1 .r1 – заголовок      Bebas Neue (кириллица – Oswald)
   Р2 .r2 – подзаголовок   Montserrat 700, 19px
   Р3 body/p/li – текст    Montserrat 400, 16px, один цвет
   Р4 .r4 – метка          11px CAPS, разрядка, янтарь
   Бейджи авторов (.who) и номера – декор, ролями не считаются.
   ============================================================ */
:root{
  --c-amber:#DE9232;--c-olive:#88A620;--c-dark:#2C2D27;--c-cream:#FCF7E5;
  --c-warm-yellow:#F2C572;--c-offwhite:#FDFDF9;--c-terracotta:#BE622B;--c-dark-brown:#1C140E;
  --font-body:'Montserrat',sans-serif;--font-heading:'Bebas Neue','Oswald',sans-serif;
  --radius-md:12px;--radius-lg:20px;--shadow-card:0 2px 12px rgba(44,45,38,.07);--line:rgba(223,146,50,.22);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--font-body);background:var(--c-offwhite);color:var(--c-dark);font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased}
b,strong{font-weight:700}
.r1{font-family:var(--font-heading);font-weight:500;font-size:clamp(2rem,4vw,3.2rem);line-height:1.04;letter-spacing:.02em;color:var(--c-dark-brown)}
.r2{font-size:19px;font-weight:700;line-height:1.4;color:var(--c-dark)}
.r4{font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--c-amber)}
.wrap{max-width:1040px;margin:0 auto;padding:0 clamp(1rem,4vw,2rem)}
section{padding:clamp(2rem,4vw,3.2rem) 0}
.sec-head{margin-bottom:1.5rem}
.sec-head .r4{display:block;margin-bottom:.5rem}
.sec-head p{margin-top:.9rem;max-width:820px}
#hero{background:var(--c-dark-brown);position:relative;overflow:hidden;padding:clamp(2.2rem,5vw,3.8rem) 0}
#hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 55% 70% at 85% 40%,rgba(223,146,50,.13) 0%,transparent 65%)}
.hero-in{position:relative;z-index:1}
#hero .r4{display:block;margin-bottom:.9rem}
#hero .r1{color:var(--c-offwhite);font-size:clamp(2.2rem,5vw,3.8rem);max-width:840px;margin-bottom:.9rem}
#hero p{color:var(--c-cream);opacity:.85;max-width:700px}
.stats{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1.4rem}
.stats span{border:1px solid rgba(222,146,50,.5);border-radius:40px;padding:.35rem .9rem;color:var(--c-cream);font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase}
.jump{position:sticky;top:0;z-index:10;background:var(--c-cream);border-bottom:1px solid var(--line)}
.jump-inner{display:flex;gap:.4rem;overflow-x:auto;padding:.7rem 0;scrollbar-width:none}
.jump-inner::-webkit-scrollbar{display:none}
.tab{flex:none;padding:.45rem .9rem;border-radius:40px;border:1px solid var(--c-amber);background:transparent;color:var(--c-dark-brown);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;font-family:var(--font-body)}
.tab:hover{background:var(--c-warm-yellow)}
.tab.on{background:var(--c-dark-brown);color:var(--c-cream);border-color:var(--c-dark-brown)}
.panel{display:none}
.panel.on{display:block}
.grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius-md);padding:1.2rem 1.35rem;box-shadow:var(--shadow-card)}
.card .r4{display:block;margin-bottom:.35rem}
.card .r2{margin-bottom:.6rem}
.cream{background:var(--c-cream)}
ul{padding-left:1.15rem}
li+li{margin-top:.4rem}
.who{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:40px;padding:.08rem .5rem;margin-right:.3rem;white-space:nowrap;border:1px solid var(--c-amber);color:var(--c-dark-brown)}
.who.mag{background:var(--c-warm-yellow)}
.who.sber{background:#fff}
.who.nat{background:rgba(136,166,32,.18);border-color:var(--c-olive)}
.who.olya{background:rgba(190,98,43,.12);border-color:var(--c-terracotta)}
.who.ang{background:rgba(44,45,38,.08);border-color:var(--c-dark)}
.legend{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin-top:1rem}
.st-top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:1rem;align-items:flex-start;margin-bottom:1.2rem}
.st-top .r4{display:block;margin-bottom:.3rem}
.block{margin-top:1.2rem}
.block>.r2{margin-bottom:.6rem}
.pitch{background:var(--c-cream);border-left:4px solid var(--c-amber);border-radius:0 var(--radius-md) var(--radius-md) 0;padding:1rem 1.25rem}
.btns{display:flex;flex-wrap:wrap;gap:.5rem}
button.act{font-family:var(--font-body);font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;padding:.55rem 1rem;border-radius:40px;border:1px solid var(--c-amber);background:var(--c-warm-yellow);color:var(--c-dark-brown);cursor:pointer}
button.act.ghost{background:transparent}
button.act:hover{background:var(--c-amber)}
.count{font-family:var(--font-heading);font-size:2.1rem;line-height:1;color:var(--c-terracotta);display:block;margin-bottom:.3rem}
footer{background:var(--c-dark-brown);padding:1.8rem 0;margin-top:1rem}
footer p{color:var(--c-cream);opacity:.7}
@media print{.jump,.btns{display:none}.panel{display:block}}
</style>

<style>
/* ---- КАЛЕНДАРЬ ПРОГРАММЫ ---- */
.filt{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin-bottom:.6rem}
.filt .r4{min-width:132px}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center}
.chip{font-family:var(--font-body);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  padding:.35rem .8rem;border-radius:40px;border:1px solid var(--line);background:#fff;color:var(--c-dark-brown);cursor:pointer}
.chip:hover{border-color:var(--c-amber)}
.chip.on{background:var(--c-dark-brown);color:var(--c-cream);border-color:var(--c-dark-brown)}
.cal-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius-md);background:#fff}
.cal-grid{display:flex;min-width:max-content}
.cal-col{flex:none;width:228px;border-right:1px solid var(--line)}
.cal-col:last-child{border-right:none}
.cal-col.we{background:rgba(242,197,114,.08)}
.cal-col.today{background:rgba(136,166,32,.08)}
.cal-times{width:64px;position:sticky;left:0;z-index:3;background:var(--c-cream)}
.cal-head{background:var(--c-dark-brown);color:var(--c-cream);padding:.5rem .6rem;text-align:center;border-bottom:1px solid var(--line)}
.cal-d{display:block;font-family:var(--font-heading);font-size:1.5rem;line-height:1;letter-spacing:.02em}
.cal-w{display:block;font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--c-amber);margin-top:.15rem}
.cal-ads{min-height:38px;padding:.25rem;border-bottom:1px solid var(--line)}
.cal-ad{border-radius:8px;padding:.3rem .5rem;margin-bottom:.25rem;font-size:12px;line-height:1.3;border-left:5px solid}
.cal-av{border-radius:8px;padding:.3rem .5rem;margin-bottom:.25rem;font-size:12px;line-height:1.3;border-left:5px solid}
.cal-av.hide{display:none}
.cal-av.av-yes{background:rgba(136,166,32,.2);border-left-color:var(--c-olive)}
.cal-av.av-part{background:rgba(242,197,114,.42);border-left-color:var(--c-amber)}
.cal-av.av-maybe{background:#fff;border-left-color:#7C7C72;border-left-style:dashed}
.cal-body{position:relative}
.cal-line{position:absolute;left:0;right:0;border-top:1px solid rgba(223,146,50,.2)}
.cal-line.half{border-top-style:dotted;border-top-color:rgba(223,146,50,.12)}
.cal-h{height:40px;font-size:11px;font-weight:700;letter-spacing:.06em;padding:.15rem .5rem;text-align:right;border-top:1px solid rgba(223,146,50,.2)}
.cal-h.half{border-top-style:dotted;border-top-color:rgba(223,146,50,.12)}
.cal-ev{position:absolute;border-radius:8px;padding:.22rem .45rem;overflow:hidden;font-size:11.5px;line-height:1.24;
  border-left:5px solid;text-decoration:none;color:var(--c-dark);display:block}
.cal-ev:hover{box-shadow:0 2px 10px rgba(44,45,38,.18)}
.cal-ev.tiny{font-size:10.5px;padding:.1rem .4rem;line-height:1.15}
.cal-ev.tiny .cal-t,.cal-ev.tiny .cal-nm{display:inline;margin-right:.25rem}
.cal-ev.tiny .cal-note,.cal-ev.tiny .cal-who,.cal-ev.tiny .fm{display:none}
.cal-ev.hide,.cal-ad.hide,.cal-av.hide{display:none}
.cal-t{display:block;font-size:11px;font-weight:700;letter-spacing:.03em}
.cal-nm{display:block;font-weight:700}
.cal-note{display:block;font-size:11px;opacity:.72}
.cal-who{display:block;font-size:11px;font-weight:700;margin-top:.15rem;opacity:.9}
.cal-src{display:block;font-size:11px;margin-top:.15rem;opacity:.6}
.cal-ev.tiny .cal-src{display:none}
.fm{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border-radius:40px;padding:0 .4rem;border:1px solid;margin-right:.2rem}
.fm.on{background:#fff;border-color:var(--c-olive);color:var(--c-dark)}
.fm.off{background:var(--c-dark-brown);border-color:var(--c-dark-brown);color:var(--c-cream)}
.fm.tbc{background:transparent;border-style:dashed;border-color:var(--c-dark);color:var(--c-dark)}
.fm.fix{background:rgba(136,166,32,.2);border-color:var(--c-olive);color:var(--c-dark)}
.fm.todo{background:#fff;border-style:dashed;border-color:var(--c-terracotta);color:var(--c-terracotta)}
/* цвет = тип встречи */
.t-progon{background:rgba(190,98,43,.14);border-left-color:var(--c-terracotta)}
.t-ustan{background:rgba(136,166,32,.18);border-left-color:var(--c-olive)}
.t-one{background:rgba(44,45,38,.08);border-left-color:#7C7C72}
.t-repet{background:rgba(242,197,114,.42);border-left-color:var(--c-amber)}
.t-dop{background:var(--c-cream);border-left-color:var(--c-dark-brown)}
.t-summit{background:var(--c-dark-brown);border-left-color:var(--c-amber);color:var(--c-cream)}
.cal-ev.free{border-left-style:dashed;background:rgba(44,45,38,.05);color:rgba(44,45,38,.8)}
.chip.t-progon,.chip.t-ustan,.chip.t-one,.chip.t-repet,.chip.t-dop,.chip.t-summit{border-left-width:5px;border-left-style:solid}
.chip.on{background:var(--c-dark-brown);color:var(--c-cream)}
.cal-foot{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin-top:1rem}
@media print{.cal-scroll{overflow:visible}.filt,.cal-foot{display:none}}
</style>

<style>
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--c-dark-brown)}
.gate-card{max-width:460px;background:var(--c-cream);border-radius:var(--radius-lg);padding:40px 34px;text-align:center}
.gate-card .r4{display:block;margin-bottom:.8rem}
.gate-card .r2{margin-bottom:.8rem}
</style>

  function init() {

function show(id){
  document.querySelectorAll('.panel').forEach(function(p){p.classList.toggle('on',p.id===id);});
  document.querySelectorAll('.tab').forEach(function(t){t.classList.toggle('on',t.dataset.p===id);});
  window.scrollTo({top:0,behavior:'smooth'});
  try{localStorage.setItem('sber500-tab',id);}catch(e){}
}
document.querySelectorAll('.tab').forEach(function(t){t.addEventListener('click',function(){show(t.dataset.p);});});
try{var saved=localStorage.getItem('sber500-tab'); if(saved&&document.getElementById(saved)) show(saved);}catch(e){}

function txtOf(el){
  var c=el.cloneNode(true);
  c.querySelectorAll('.who').forEach(function(w){w.textContent=w.textContent.trim()+': ';});
  return c.textContent.replace(/\s+/g,' ').trim();
}
function whoOf(b){var w=b.querySelector('.r2 .who');return w?w.textContent.trim():'';}
function cardText(id){
  var a=document.getElementById(id), out=[a.dataset.name,''];
  a.querySelectorAll('.block').forEach(function(b){
    var w=whoOf(b);
    out.push(txtOf(b.querySelector('.r2')).toUpperCase());
    b.querySelectorAll('li').forEach(function(li){out.push('- '+(w?'['+w+'] ':'')+txtOf(li));});
    out.push('');
  });
  return out.join('\n');
}
function cp(id){
  var t=cardText(id);
  (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){},function(){prompt('',t);});
}
function dl(id){
  var a=document.getElementById(id), css='';
  document.querySelectorAll('style').forEach(function(s){css+=s.outerHTML;});
  var zones=document.getElementById('p0').querySelector('.grid').outerHTML;
  var card=a.cloneNode(true); var b=card.querySelector('.btns'); if(b) b.remove();
  var html='<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Обратная связь – '+a.dataset.name+'</title><link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@500&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">'+css+'</head>'+'<bo'+'dy>'

   +'<section>'+card.innerHTML+'</section>'
   +'<section><div class="wrap"><div class="sec-head"><span class="r4">Сводка по всем выступлениям</span><h2 class="r1">Критичные зоны и общие узкие места</h2></div>'+zones+'</div></section>'+'</bo'+'dy></html>';
  var bl=new Blob([html],{type:'text/html'}), u=URL.createObjectURL(bl), l=document.createElement('a');

}

  // ---- календарь программы: выгрузка и фильтры ----
  function calEvents(){
    var out=[];
    document.querySelectorAll('.cal-ev,.cal-ad').forEach(function(el){
      var d=el.dataset.d; if(!d) return;
      out.push({d:d,s:el.dataset.s,e:el.dataset.e,t:el.dataset.sum||'',
                n:el.dataset.desc||'',l:el.dataset.loc||''});
    });
    return out;
  }
  function calNextDay(d){var x=new Date(Date.UTC(+d.slice(0,4),+d.slice(4,6)-1,+d.slice(6,8)+1));
    return x.toISOString().slice(0,10).replace(/-/g,'');}
  function calBuild(){
    var nm=(document.querySelector('#pcal .r1')||{}).textContent||'Programma';
    var L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//methodtsyro//cal//RU','CALSCALE:GREGORIAN','X-WR-CALNAME:'+nm];
    calEvents().forEach(function(e,i){
      L.push('BEGIN:VEVENT','UID:ev'+i+'-'+e.d+'@methodtsyro.ru','DTSTAMP:20260918T060000Z');
      if(e.s){L.push('DTSTART;TZID=Europe/Moscow:'+e.d+'T'+e.s,'DTEND;TZID=Europe/Moscow:'+e.d+'T'+e.e);}
      else {L.push('DTSTART;VALUE=DATE:'+e.d,'DTEND;VALUE=DATE:'+calNextDay(e.d));}
      L.push('SUMMARY:'+e.t.replace(/[,;\\]/g,' '));
      if(e.n) L.push('DESCRIPTION:'+e.n.replace(/[,;\\]/g,' '));
      if(e.l) L.push('LOCATION:'+e.l.replace(/[,;\\]/g,' '));
      L.push('END:VEVENT');
    });
    L.push('END:VCALENDAR');
    return L.join('\r\n');
  }
  function calSave(){
    var nm2=(document.querySelector('#pcal .r1')||{}).textContent||'calendar';
    var bl=new Blob(['\ufeff'+calBuild()],{type:'text/calendar;charset=utf-8'});
    var u=URL.createObjectURL(bl),a=document.createElement('a');
    a.href=u;a.download=nm2+'.ics';document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(u);},1000);
  }
  function calGoogle(){
    calSave();
    setTimeout(function(){window.open('https://calendar.google.com/calendar/u/0/r/settings/export','_blank','noopener');},600);
  }
  var calPicked={who:[],fmt:[],type:[],prog:[]};
  function calMatch(el){
    var who=(el.dataset.who||'').split(' ');
    if(calPicked.who.length && !calPicked.who.some(function(v){return who.indexOf(v)>-1;})) return false;
    if(calPicked.fmt.length && calPicked.fmt.indexOf(el.dataset.fmt)<0) return false;
    if(calPicked.type.length && calPicked.type.indexOf(el.dataset.type)<0) return false;
    if(calPicked.prog.length && calPicked.prog.indexOf(el.dataset.prog)<0) return false;
    return true;
  }
  function calApply(){
    document.querySelectorAll('.cal-ev,.cal-ad,.cal-av').forEach(function(el){
      el.classList.toggle('hide', !calMatch(el));
    });
    var c=document.getElementById('fcount');
    if(c) c.textContent=document.querySelectorAll('.cal-ev:not(.hide),.cal-ad:not(.hide)').length;
  }
  document.querySelectorAll('.chip').forEach(function(ch){
    ch.addEventListener('click',function(){
      var f=ch.dataset.f, v=ch.dataset.v, arr=calPicked[f], i=arr.indexOf(v);
      if(i>-1){arr.splice(i,1);ch.classList.remove('on');} else {arr.push(v);ch.classList.add('on');}
      calApply();
    });
  });
  var calReset=document.getElementById('reset');
  if(calReset) calReset.addEventListener('click',function(){
    calPicked={who:[],fmt:[],type:[],prog:[]};
    document.querySelectorAll('.chip').forEach(function(c){c.classList.remove('on');});
    calApply();
  });

<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Доступ по ссылке</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@500&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   ТИПОГРАФИЧЕСКАЯ ШКАЛА – РОВНО 4 РОЛИ, КУРСИВОВ НЕТ
   Р1 .r1 – заголовок      Bebas Neue (кириллица – Oswald)
   Р2 .r2 – подзаголовок   Montserrat 700, 19px
   Р3 body/p/li – текст    Montserrat 400, 16px, один цвет
   Р4 .r4 – метка          11px CAPS, разрядка, янтарь
   Бейджи авторов (.who) и номера – декор, ролями не считаются.
   ============================================================ */
:root{
  --c-amber:#DE9232;--c-olive:#88A620;--c-dark:#2C2D27;--c-cream:#FCF7E5;
  --c-warm-yellow:#F2C572;--c-offwhite:#FDFDF9;--c-terracotta:#BE622B;--c-dark-brown:#1C140E;
  --font-body:'Montserrat',sans-serif;--font-heading:'Bebas Neue','Oswald',sans-serif;
  --radius-md:12px;--radius-lg:20px;--shadow-card:0 2px 12px rgba(44,45,38,.07);--line:rgba(223,146,50,.22);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--font-body);background:var(--c-offwhite);color:var(--c-dark);font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased}
b,strong{font-weight:700}
.r1{font-family:var(--font-heading);font-weight:500;font-size:clamp(2rem,4vw,3.2rem);line-height:1.04;letter-spacing:.02em;color:var(--c-dark-brown)}
.r2{font-size:19px;font-weight:700;line-height:1.4;color:var(--c-dark)}
.r4{font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--c-amber)}
.wrap{max-width:1040px;margin:0 auto;padding:0 clamp(1rem,4vw,2rem)}
section{padding:clamp(2rem,4vw,3.2rem) 0}
.sec-head{margin-bottom:1.5rem}
.sec-head .r4{display:block;margin-bottom:.5rem}
.sec-head p{margin-top:.9rem;max-width:820px}
#hero{background:var(--c-dark-brown);position:relative;overflow:hidden;padding:clamp(2.2rem,5vw,3.8rem) 0}
#hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 55% 70% at 85% 40%,rgba(223,146,50,.13) 0%,transparent 65%)}
.hero-in{position:relative;z-index:1}
#hero .r4{display:block;margin-bottom:.9rem}
#hero .r1{color:var(--c-offwhite);font-size:clamp(2.2rem,5vw,3.8rem);max-width:840px;margin-bottom:.9rem}
#hero p{color:var(--c-cream);opacity:.85;max-width:700px}
.stats{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1.4rem}
.stats span{border:1px solid rgba(222,146,50,.5);border-radius:40px;padding:.35rem .9rem;color:var(--c-cream);font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase}
.jump{position:sticky;top:0;z-index:10;background:var(--c-cream);border-bottom:1px solid var(--line)}
.jump-inner{display:flex;gap:.4rem;overflow-x:auto;padding:.7rem 0;scrollbar-width:none}
.jump-inner::-webkit-scrollbar{display:none}
.tab{flex:none;padding:.45rem .9rem;border-radius:40px;border:1px solid var(--c-amber);background:transparent;color:var(--c-dark-brown);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;font-family:var(--font-body)}
.tab:hover{background:var(--c-warm-yellow)}
.tab.on{background:var(--c-dark-brown);color:var(--c-cream);border-color:var(--c-dark-brown)}
.panel{display:none}
.panel.on{display:block}
.grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius-md);padding:1.2rem 1.35rem;box-shadow:var(--shadow-card)}
.card .r4{display:block;margin-bottom:.35rem}
.card .r2{margin-bottom:.6rem}
.cream{background:var(--c-cream)}
ul{padding-left:1.15rem}
li+li{margin-top:.4rem}
.who{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:40px;padding:.08rem .5rem;margin-right:.3rem;white-space:nowrap;border:1px solid var(--c-amber);color:var(--c-dark-brown)}
.who.mag{background:var(--c-warm-yellow)}
.who.sber{background:#fff}
.who.nat{background:rgba(136,166,32,.18);border-color:var(--c-olive)}
.who.olya{background:rgba(190,98,43,.12);border-color:var(--c-terracotta)}
.who.ang{background:rgba(44,45,38,.08);border-color:var(--c-dark)}
.legend{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin-top:1rem}
.st-top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:1rem;align-items:flex-start;margin-bottom:1.2rem}
.st-top .r4{display:block;margin-bottom:.3rem}
.block{margin-top:1.2rem}
.block>.r2{margin-bottom:.6rem}
.pitch{background:var(--c-cream);border-left:4px solid var(--c-amber);border-radius:0 var(--radius-md) var(--radius-md) 0;padding:1rem 1.25rem}
.btns{display:flex;flex-wrap:wrap;gap:.5rem}
button.act{font-family:var(--font-body);font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;padding:.55rem 1rem;border-radius:40px;border:1px solid var(--c-amber);background:var(--c-warm-yellow);color:var(--c-dark-brown);cursor:pointer}
button.act.ghost{background:transparent}
button.act:hover{background:var(--c-amber)}
.count{font-family:var(--font-heading);font-size:2.1rem;line-height:1;color:var(--c-terracotta);display:block;margin-bottom:.3rem}
footer{background:var(--c-dark-brown);padding:1.8rem 0;margin-top:1rem}
footer p{color:var(--c-cream);opacity:.7}
@media print{.jump,.btns{display:none}.panel{display:block}}
</style>

<style>
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--c-dark-brown)}
.gate-card{max-width:460px;background:var(--c-cream);border-radius:var(--radius-lg);padding:40px 34px;text-align:center}
.gate-card .r4{display:block;margin-bottom:.8rem}
.gate-card .r2{margin-bottom:.8rem}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
</head>

<div class="gate" id="gate">
  <div class="gate-card">
    <span class="r4">Конфиденциально</span>
    <p class="r2">Материал доступен по персональной ссылке</p>
    <p>Откройте страницу по ссылке, которую вы получили от команды программы. Если ссылка не открывается, напишите Светлане Цыро.</p>
  </div>
</div>

  function init() {

function show(id){
  document.querySelectorAll('.panel').forEach(function(p){p.classList.toggle('on',p.id===id);});
  document.querySelectorAll('.tab').forEach(function(t){t.classList.toggle('on',t.dataset.p===id);});

function txtOf(el){
  var c=el.cloneNode(true);
  c.querySelectorAll('.who').forEach(function(w){w.textContent=w.textContent.trim()+': ';});
  return c.textContent.replace(/\s+/g,' ').trim();
}
function whoOf(b){var w=b.querySelector('.r2 .who');return w?w.textContent.trim():'';}
function cardText(id){
  var a=document.getElementById(id), out=[a.dataset.name,''];
  a.querySelectorAll('.block').forEach(function(b){
    var w=whoOf(b);
    out.push(txtOf(b.querySelector('.r2')).toUpperCase());
    b.querySelectorAll('li').forEach(function(li){out.push('- '+(w?'['+w+'] ':'')+txtOf(li));});
    out.push('');
  });
  return out.join('\n');
}
function cp(id){
  var t=cardText(id);

}
function dl(id){
  var a=document.getElementById(id), css='';

    if (out.indexOf('<!--ok-->') !== 0) throw new Error('bad key');
    return out.slice(9);
  }

  function go() {
  try {
    var html = open(k);
    try { localStorage.setItem(STORE, k); } catch (e) {}

  } catch (e) { try { if (!fromUrl) localStorage.removeItem(STORE); } catch (e2) {} }
  }

  else { var tries = 0, tid = setInterval(function () {

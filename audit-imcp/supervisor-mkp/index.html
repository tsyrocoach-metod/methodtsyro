<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Доступ по ссылке</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@500&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   ТИПОГРАФИЧЕСКАЯ ШКАЛА – РОВНО 4 РОЛИ, КУРСИВОВ НЕТ
   Р1 .r1 – заголовок      Bebas Neue (кириллица – Oswald), крупно
   Р2 .r2 – подзаголовок   Montserrat 700, 19px
   Р3 body/p/li – текст    Montserrat 400, 16px, один цвет
   Р4 .r4 – метка          11px CAPS, разрядка, янтарь
   Декоративные цифры (.step-num) ролью не считаются.
   ============================================================ */
:root{
  --c-amber:#DE9232;
  --c-olive:#88A620;
  --c-dark:#2C2D27;
  --c-khaki:#A69752;
  --c-cream:#FCF7E5;
  --c-warm-yellow:#F2C572;
  --c-offwhite:#FDFDF9;
  --c-terracotta:#BE622B;
  --c-dark-brown:#1C140E;
  --font-body:'Montserrat',sans-serif;
  --font-heading:'Bebas Neue','Oswald',sans-serif;
  --radius-md:12px;
  --radius-lg:20px;
  --shadow-card:0 2px 12px rgba(44,45,38,.07);
  --line:rgba(223,146,50,.22);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--font-body);background:var(--c-offwhite);color:var(--c-dark);font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased}
b,strong{font-weight:700}
/* ---- РОЛИ ---- */
.r1{font-family:var(--font-heading);font-weight:500;font-size:clamp(2.1rem,4.2vw,3.4rem);line-height:1.02;letter-spacing:.02em;color:var(--c-dark-brown)}
.r2{font-size:19px;font-weight:700;line-height:1.4;color:var(--c-dark)}
.r4{font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--c-amber)}
/* ---- КАРКАС ---- */
.wrap{max-width:980px;margin:0 auto;padding:0 clamp(1rem,4vw,2rem)}
section{padding:clamp(2.8rem,6vw,4.5rem) 0;scroll-margin-top:4.5rem}
section+section{border-top:1px solid var(--line)}
.sec-head{margin-bottom:1.8rem}
.sec-head .r4{display:block;margin-bottom:.5rem}
.sec-head p{margin-top:1rem;max-width:760px}
p+p{margin-top:.8rem}
.block{margin-top:2.2rem}
.block>.r2{margin-bottom:.8rem}
/* ---- HERO ---- */
#hero{background:var(--c-dark-brown);position:relative;overflow:hidden;padding:clamp(2.8rem,7vw,5rem) 0}
#hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 55% 70% at 85% 40%,rgba(223,146,50,.13) 0%,transparent 65%)}
.hero-in{position:relative;z-index:1}
.hero-eyebrow{display:flex;align-items:center;gap:.75rem;margin-bottom:1.1rem}
.hero-eyebrow::before{content:'';display:block;width:32px;height:1px;background:var(--c-amber);flex:none}
#hero .r1{color:var(--c-offwhite);font-size:clamp(2.6rem,6.5vw,5rem);max-width:820px;margin-bottom:1.2rem}
#hero p{color:var(--c-cream);opacity:.85;max-width:640px}
.conf{margin-top:1.8rem;display:inline-block;border:1px solid rgba(222,146,50,.5);border-radius:40px;padding:.45rem 1rem}
/* ---- НАВИГАЦИЯ ---- */
.jump{position:sticky;top:0;z-index:10;background:var(--c-cream);border-bottom:1px solid var(--line)}
.jump-inner{display:flex;gap:.5rem;overflow-x:auto;padding-top:.8rem;padding-bottom:.8rem;scrollbar-width:none}
.jump-inner::-webkit-scrollbar{display:none}
.jump a{flex:none;padding:.45rem .95rem;border-radius:40px;border:1px solid var(--c-amber);color:var(--c-dark-brown);text-decoration:none;font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;transition:background .2s}
.jump a:hover,.jump a.on{background:var(--c-warm-yellow)}
/* ---- КАРТОЧКИ ---- */
.grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.grid-3{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius-md);padding:1.3rem 1.4rem;box-shadow:var(--shadow-card)}
.card .r4{display:block;margin-bottom:.4rem}
.card .r2{margin-bottom:.5rem}
.card p+.r4{margin-top:.9rem}
.cream{background:var(--c-cream)}
/* ---- ПРИМЕНИТЬ / ПРОВЕРИТЬ ---- */
.apply{background:var(--c-cream);border-left:4px solid var(--c-olive);border-radius:0 var(--radius-md) var(--radius-md) 0;padding:1.2rem 1.4rem;margin-top:1.2rem}
.apply .r4{display:block;margin-bottom:.4rem;color:var(--c-olive)}
.quote{border-left:3px solid var(--c-amber);padding:.2rem 0 .2rem 1rem;margin-top:.6rem}
.check{background:#fff;border:1px dashed var(--c-amber);border-radius:var(--radius-md);padding:1.2rem 1.4rem;margin-top:1.2rem}
.check>.r4{display:block;margin-bottom:.6rem}
.check label{display:flex;gap:.7rem;align-items:flex-start;cursor:pointer;padding:.35rem 0}
.check input{appearance:none;flex:none;width:20px;height:20px;margin-top:.2rem;border:2px solid var(--c-amber);border-radius:5px;background:#fff;cursor:pointer;display:grid;place-content:center}
.check input::after{content:'';width:10px;height:10px;border-radius:2px;background:var(--c-olive);transform:scale(0);transition:transform .15s}
.check input:checked::after{transform:scale(1)}
.check label:has(input:checked) span{opacity:.55}
.count{display:block;margin-top:.6rem}
/* ---- ПАРЫ «НЕ ТАК / ТАК» ---- */
.pair{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:1rem}
.pair>div{border-radius:var(--radius-md);padding:1.1rem 1.3rem}
.pair .no{background:#fff;border:1px solid rgba(190,98,43,.35)}
.pair .yes{background:#fff;border:1px solid rgba(136,166,32,.45)}
.pair .no .r4{color:var(--c-terracotta);display:block;margin-bottom:.35rem}
.pair .yes .r4{color:var(--c-olive);display:block;margin-bottom:.35rem}
/* ---- АККОРДЕОН ПРИНЦИПОВ ---- */
details.pr{background:#fff;border:1px solid var(--line);border-radius:var(--radius-md);box-shadow:var(--shadow-card);margin-top:.8rem}
details.pr summary{list-style:none;cursor:pointer;padding:1.1rem 1.4rem;display:flex;gap:1rem;align-items:center}
details.pr summary::-webkit-details-marker{display:none}
details.pr summary::after{content:'+';margin-left:auto;font-size:24px;line-height:1;color:var(--c-amber);transition:transform .2s}
details.pr[open] summary::after{transform:rotate(45deg)}
.pr-body{padding:0 1.4rem 1.4rem}
.step-num{font-family:var(--font-heading);font-size:2.6rem;line-height:1;color:var(--c-amber);flex:none;min-width:2.2rem}
/* ---- ЛЕСТНИЦА ---- */
.ladder{counter-reset:st;display:grid;gap:.6rem;margin-top:1rem}
.ladder li{list-style:none;display:grid;grid-template-columns:2.6rem 1fr;gap:.8rem;align-items:start;background:#fff;border:1px solid var(--line);border-radius:var(--radius-md);padding:.8rem 1rem}
.ladder li::before{counter-increment:st;content:counter(st);font-family:var(--font-heading);font-size:2rem;line-height:1;color:var(--c-amber)}
/* ---- ШАГИ УРОКА ---- */
.flow{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin:1.2rem 0}
.flow span{background:var(--c-dark-brown);color:var(--c-cream);border-radius:40px;padding:.4rem 1rem}
.flow i{font-style:normal;color:var(--c-amber)}
.lstep{display:grid;grid-template-columns:3.2rem 1fr;gap:1rem;margin-top:1.4rem;background:#fff;border:1px solid var(--line);border-radius:var(--radius-lg);padding:1.4rem;box-shadow:var(--shadow-card)}
.lstep .r2{margin-bottom:.4rem}
/* ---- ПРАКТИКИ И РАЗМИНКИ ---- */
.tag{display:inline-block;background:var(--c-warm-yellow);border-radius:40px;padding:.15rem .7rem;margin-bottom:.5rem}
.tag.r4{color:var(--c-dark-brown)}
.kv{margin-top:.6rem}
.kv b{display:block}
ul.dash{list-style:none;margin-top:.5rem}
ul.dash li{position:relative;padding-left:1.2rem;margin-top:.35rem}
ul.dash li::before{content:'–';position:absolute;left:0;color:var(--c-amber)}
/* ---- ФУТЕР ---- */
footer{background:var(--c-dark-brown);color:var(--c-cream);padding:2.5rem 0}
footer p{opacity:.8;max-width:760px}
footer .r4{display:block;margin-bottom:.6rem}
.mt{margin-top:1rem}
.check.mt0{margin-top:0}
@media (max-width:700px){
  .pair{grid-template-columns:1fr}
  .lstep{grid-template-columns:1fr}
  .lstep .step-num{margin-bottom:-.4rem}
}
@media print{.jump{display:none}section{page-break-inside:avoid}}
/* ---- ТЕХ-ГАЙДЛАЙН ---- */
.two{display:grid;grid-template-columns:1fr 1fr;gap:1.2rem;align-items:start}
.mock{background:#fff;border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow-card);overflow:hidden;position:sticky;top:5rem}
.mock-bar{display:flex;gap:6px;padding:.6rem .9rem;background:var(--c-cream);border-bottom:1px solid var(--line)}
.mock-bar span{width:9px;height:9px;border-radius:50%;background:var(--c-khaki);opacity:.5}
.mock-in{padding:1.2rem 1.3rem}
.mock-in>.r4{display:block;margin-bottom:.3rem}
.mock-in>.r2{margin-bottom:.6rem}
.mock-in p+p{margin-top:.6rem}
.mock-video{margin:1rem 0 .4rem;aspect-ratio:16/9;background:var(--c-dark-brown);border-radius:var(--radius-md);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.3rem;color:var(--c-cream)}
.mock-video span{width:52px;height:52px;border-radius:50%;background:var(--c-amber);color:var(--c-dark-brown);display:grid;place-content:center}
.mock-tc{opacity:.75}
.mock-btns{display:flex;flex-wrap:wrap;gap:.5rem;margin:.9rem 0}
.mock-task{background:var(--c-cream);border-left:4px solid var(--c-olive);border-radius:0 var(--radius-md) var(--radius-md) 0;padding:.9rem 1rem;margin:.9rem 0}
.mock-task .r4{display:block;margin-bottom:.3rem;color:var(--c-olive)}
.btn{font:inherit;font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;border:1px solid var(--c-amber);background:var(--c-amber);color:var(--c-dark-brown);border-radius:40px;padding:.6rem 1.1rem;cursor:pointer;display:inline-block}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.35;cursor:default}
.cta{display:flex;flex-wrap:wrap;gap:1rem;align-items:center;justify-content:space-between;background:var(--c-dark-brown);color:var(--c-cream);border-radius:var(--radius-lg);padding:1.4rem 1.6rem;margin-top:1.4rem}
.cta .r2{color:var(--c-offwhite)}
.cta p{opacity:.9}
.tree{display:grid;gap:.8rem;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.node{background:#fff;border:1px solid var(--line);border-top:4px solid var(--c-amber);border-radius:var(--radius-md);padding:1rem 1.2rem}
.node.muted{border-top-color:var(--c-khaki);background:var(--c-cream)}
body.lock{overflow:hidden}
.modal{position:fixed;inset:0;z-index:50;background:rgba(28,20,14,.72);display:flex;align-items:center;justify-content:center;padding:clamp(.5rem,3vw,2rem)}
.modal[hidden]{display:none}
.modal-box{background:var(--c-offwhite);border-radius:var(--radius-lg);width:min(760px,100%);max-height:92vh;display:flex;flex-direction:column;overflow:hidden}
.modal-top{display:flex;align-items:center;justify-content:space-between;padding:.9rem 1.3rem;background:var(--c-cream);border-bottom:1px solid var(--line)}
.x{font:inherit;font-size:26px;line-height:1;border:none;background:transparent;color:var(--c-dark-brown);cursor:pointer;padding:0 .3rem}
.slides{overflow-y:auto;padding:1.5rem clamp(1.1rem,4vw,2.2rem);flex:1}
.slide{display:none}
.slide.on{display:block}
.slide>.r4{display:block;margin-bottom:.5rem}
.slide>.r1,.slide>.r2{margin-bottom:.8rem}
.slide p+p,.slide ul+p,.slide p+ul{margin-top:.7rem}
.modal-nav{display:flex;align-items:center;justify-content:space-between;gap:.5rem;padding:.9rem 1.3rem;border-top:1px solid var(--line)}
@media (max-width:760px){.two{grid-template-columns:1fr}.mock{position:static}}
/* ---- ГЛАВНАЯ ---- */
.back{display:inline-block;margin-bottom:1.2rem;text-decoration:none}
.verdict{background:var(--c-cream);border-left:4px solid var(--c-amber);border-radius:0 var(--radius-lg) var(--radius-lg) 0;padding:1.5rem 1.7rem;max-width:860px}
.cols3{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(270px,1fr))}
.col{background:#fff;border:1px solid var(--line);border-radius:var(--radius-md);padding:1.2rem 1.3rem;box-shadow:var(--shadow-card);border-top:5px solid var(--c-khaki)}
.col>.r4{display:block;margin-bottom:.3rem}
.col.good{border-top-color:var(--c-olive)}.col.good>.r4{color:var(--c-olive)}
.col.grow{border-top-color:var(--c-amber)}
.col.crit{border-top-color:var(--c-terracotta)}.col.crit>.r4{color:var(--c-terracotta)}
.team{display:flex;flex-direction:column;gap:.5rem;text-decoration:none;color:inherit;background:var(--c-dark-brown);border-radius:var(--radius-lg);padding:1.5rem;transition:transform .2s}
a.team:hover{transform:translateY(-3px)}
.team .r2{color:var(--c-offwhite)}
.team p{color:var(--c-cream);opacity:.85;flex:1}
.team .btn{align-self:flex-start}
.plan{list-style:none;counter-reset:pl;display:grid;gap:.6rem}
.plan li{counter-increment:pl;display:grid;grid-template-columns:2.6rem 1fr auto;gap:1rem;align-items:start;background:#fff;border:1px solid var(--line);border-radius:var(--radius-md);padding:1rem 1.2rem}
.plan li::before{content:counter(pl);font-family:var(--font-heading);font-size:2.2rem;line-height:1;color:var(--c-amber)}
.plan .r2{margin-bottom:.2rem}
.when{white-space:nowrap;background:var(--c-warm-yellow);color:var(--c-dark-brown);border-radius:40px;padding:.2rem .7rem}
.steps{list-style:none;counter-reset:sp;display:grid;gap:0;position:relative}
.steps li{counter-increment:sp;position:relative;padding:0 0 1.4rem 3.6rem}
.steps li::before{content:counter(sp);position:absolute;left:0;top:0;width:2.6rem;height:2.6rem;border-radius:50%;background:var(--c-dark-brown);color:var(--c-cream);font-family:var(--font-heading);font-size:1.5rem;display:grid;place-content:center}
.steps li::after{content:'';position:absolute;left:1.25rem;top:2.8rem;bottom:.2rem;width:2px;background:var(--line)}
.steps li:last-child::after{display:none}
.steps .r2{margin-bottom:.2rem;padding-top:.3rem}
@media (max-width:640px){.plan li{grid-template-columns:2.2rem 1fr}.plan .when{grid-column:2;justify-self:start}}
.team-btns{display:flex;flex-wrap:wrap;gap:.5rem}
.btn.ghost-light{background:transparent;color:var(--c-cream);text-decoration:none}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.8rem;margin-bottom:1.6rem}
.stats>div{background:var(--c-dark-brown);border-radius:var(--radius-md);padding:1rem 1.1rem;display:flex;flex-direction:column;gap:.3rem}
.stats .num{font-family:var(--font-heading);font-size:2.6rem;line-height:1;color:var(--c-warm-yellow)}
.stats .r4{color:var(--c-cream)}
.lib{display:flex;flex-direction:column}
.lib .dash{flex:1}
.lib-top{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;margin-bottom:.5rem}
.lib-top .tag{margin-bottom:0}
.lvl{display:inline-block;border-radius:40px;padding:.15rem .7rem}
.lvl.fact{background:#E8F1EC;color:#4f6a12}.lvl.obs{background:#FFF1D1;color:#8a5a12}.lvl.prop{background:#FBE9DD;color:var(--c-terracotta)}
.src-note{margin-top:.8rem;opacity:.75}
.lib-btn{align-self:flex-start;margin-top:1rem;text-decoration:none}
.alltable{margin-top:1.6rem;background:var(--c-dark-brown);color:var(--c-cream);border-radius:var(--radius-lg);padding:1.5rem 1.6rem;display:flex;flex-wrap:wrap;gap:1.2rem;justify-content:space-between;align-items:flex-end}
.alltable .r2{color:var(--c-offwhite);margin:.3rem 0 .6rem}
.sheets{list-style:none;display:grid;gap:.4rem}
.sheets .lvl{margin-right:.5rem}
.plan li,.steps li{cursor:pointer;user-select:none}
.plan li .r2::before,.steps li .r2::before{content:'';display:inline-block;width:14px;height:14px;border:2px solid var(--c-amber);border-radius:4px;margin-right:.55rem;vertical-align:-1px;background:#fff}
.plan li.on .r2::before,.steps li.on .r2::before{background:var(--c-olive);border-color:var(--c-olive)}
.plan li.on div,.steps li.on p{text-decoration:line-through;opacity:.55}
/* ---- ПУНКТЫ-ЧЕКБОКСЫ ---- */
ul.dash.tick li{padding-left:2rem;cursor:pointer;user-select:none;border-radius:6px;transition:opacity .15s}
ul.dash.tick li::before{content:'';position:absolute;left:0;top:.28em;width:18px;height:18px;border:2px solid var(--c-amber);border-radius:5px;background:#fff}
ul.dash.tick li.on::after{content:'';position:absolute;left:5px;top:calc(.28em + 5px);width:8px;height:8px;border-radius:2px;background:var(--c-olive)}
ul.dash.tick li.on{text-decoration:line-through;opacity:.55}
ul.dash.tick li:focus-visible{outline:2px solid var(--c-amber);outline-offset:2px}
.col ul.dash.tick li::before,.card ul.dash.tick li::before{background:#fff}
.lib-btns{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1rem}
.lib-btns .lib-btn{margin-top:0}
.btn.ghost{background:transparent;color:var(--c-dark-brown)}
.tick-hint{margin:-.6rem 0 1.2rem;opacity:.75}
.team-btns-note{flex-direction:column;align-items:flex-start}
.access{color:var(--c-cream);opacity:.8}
.must{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));margin-bottom:1.4rem}
.must>div{background:var(--c-dark-brown);color:var(--c-cream);border-radius:var(--radius-lg);padding:1.3rem 1.5rem}
.must .num{font-family:var(--font-heading);font-size:2.6rem;line-height:1;color:var(--c-warm-yellow)}
.must .r2{color:var(--c-offwhite);margin:.3rem 0 .4rem}
.horizons{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(270px,1fr))}
.hz{background:#fff;border:1px solid var(--line);border-top:5px solid var(--c-khaki);border-radius:var(--radius-md);padding:1.2rem 1.3rem;box-shadow:var(--shadow-card)}
.hz>.r4{display:block;margin-bottom:.3rem}
.hz.accent-hz{border-top-color:var(--c-amber);background:var(--c-cream)}
</style>

<style>
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--c-dark-brown)}
.gate-card{max-width:460px;background:var(--c-cream);border-radius:var(--radius-lg);padding:40px 34px;text-align:center}
.gate-card .r4{display:block;margin-bottom:.8rem}
.gate-card .r2{margin-bottom:.8rem}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
</head>
<body>
<div class="gate" id="gate">
  <div class="gate-card">
    <span class="r4">Конфиденциально</span>
    <p class="r2">Материал доступен по персональной ссылке</p>
    <p>Откройте страницу по ссылке, которую вы получили от команды программы. Если ссылка не открывается, напишите Светлане Цыро.</p>
  </div>
</div>
